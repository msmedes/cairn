[package]
name = "cairn"
version = "0.1.0"
description = "Cairn — a kind, Socratic builder for non-technical people"
authors = ["msmedes"]
edition = "2021"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
items_after_test_module = "deny"
needless_return = "deny"

[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
mimalloc = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "sync"] }
